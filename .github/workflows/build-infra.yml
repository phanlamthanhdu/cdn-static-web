name: Build & Deploy Static Web 

on:
  workflow_dispatch:

  push:
    branches:
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      cloudfront_distribution_id: ${{ steps.tf_outputs.outputs.cloudfront_distribution_id }}
      bucket_name: ${{ steps.tf_outputs.outputs.bucket_name }}

    defaults:
      run:
        working-directory: ./infra/aws

    env:
      # AWS Login
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}

      TF_VAR_bucket_name: ${{ secrets.BUCKET_NAME }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      
      - name: Check format
        run: terraform fmt -check -recursive
      
      - name: Terraform init
        run: terraform init

      # - name: Terraform apply
      #   run: terraform apply -auto-approve

      # - name: Export Terraform Outputs
      #   id: tf_outputs
      #   run: |
      #     echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
      #     echo "bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Clone portfolio repo
        uses: actions/checkout@v4
        with:
          repository: phanlamthanhdu/portfolio-web
          path: portfolio-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create env file
        working-directory: ./portfolio-web
        run: |
          echo "NEXT_PUBLIC_GITHUB_USERNAME=phanlamthanhdu" > .env.local

      - name: Build app
        working-directory: ./portfolio-web
        run: |
          npm install
          npm run build

      - name: Deploy static files to S3
        run: |
          aws s3 sync out/ s3://${{ secrets.BUCKET_NAME }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1NFK35X4QM8H5 \
            --paths "/*"